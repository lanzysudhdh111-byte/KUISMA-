
name: Build KUISMA APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find and extract KUISMA project ZIP
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/kuisma-src"

          ZIP_FILE=""
          for candidate in \
            "KUISMA-PLP-GitHub-Build.zip" \
            "KUISMA-GitHub-AutoBuild-FIXED.zip" \
            "KUISMA-GitHub-AutoBuild.zip"; do
            if [ -f "$candidate" ]; then
              ZIP_FILE="$candidate"
              break
            fi
          done

          if [ -z "$ZIP_FILE" ]; then
            ZIP_FILE="$(find . -maxdepth 1 -type f -iname '*.zip' -print -quit || true)"
          fi

          if [ -z "$ZIP_FILE" ]; then
            echo "::error::ZIP project KUISMA tidak ditemukan di root repository."
            exit 1
          fi

          echo "Menggunakan: $ZIP_FILE"
          unzip -q "$ZIP_FILE" -d "$RUNNER_TEMP/kuisma-src"

          PROJECT_DIR="$(find "$RUNNER_TEMP/kuisma-src" -type f -name settings.gradle -printf '%h\n' | head -n 1)"
          if [ -z "$PROJECT_DIR" ]; then
            echo "::error::settings.gradle tidak ditemukan di dalam ZIP."
            exit 1
          fi

          cp -a "$PROJECT_DIR"/. "$GITHUB_WORKSPACE"/

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager --install "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Check Android project
        shell: bash
        run: |
          set -euo pipefail
          test -f settings.gradle
          test -f app/build.gradle
          test -f app/src/main/AndroidManifest.xml
          test -f app/src/main/assets/index.html

      - name: Build debug APK
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: KUISMA-debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
